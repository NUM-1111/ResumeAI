spring.application.name=agentcv
server.address=127.0.0.1
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/agentcv_validation
spring.datasource.username=agentcv_validation
spring.datasource.password=${AGENTCV_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
agentcv.operator-password-hash=${AGENTCV_OPERATOR_PASSWORD_HASH}
agentcv.material-directory=${AGENTCV_MATERIAL_DIRECTORY:/root/java/ResumeAI/.local/materials}